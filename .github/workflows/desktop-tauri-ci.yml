name: Desktop Tauri Rust CI

on:
  push:
    paths:
      - 'desktop-rust/**'
      - '.github/workflows/desktop-tauri-ci.yml'
  pull_request:
    paths:
      - 'desktop-rust/**'
      - '.github/workflows/desktop-tauri-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-tauri-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust-desktop-check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    defaults:
      run:
        working-directory: desktop-rust
    steps:
      - uses: actions/checkout@v6

      - name: Install Linux WebKitGTK and Tauri system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Setup Rust stable toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo registry and target
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop-rust

      - name: Verify Tauri config version parity
        shell: bash
        run: |
          grep -q '"version": "3.0.0"' tauri.conf.json
          grep -q 'version = "3.0.0"' Cargo.toml

      - name: Check Rust formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy lints
        run: cargo clippy --all-targets -- -D warnings

      - name: Run Rust unit tests
        run: cargo test
