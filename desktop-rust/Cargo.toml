[package]
name = "smartapps-desktop"
version = "3.0.0"
description = "SmartApps Enterprise Multi-App Desktop Shell built with Rust & Tauri 2"
authors = ["SmartApps Platform"]
edition = "2021"

[lib]
name = "smartapps_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
